# The Xcode project is generated from this file, not committed.
#
# A .pbxproj is 400-odd lines of machine-written XML: unreviewable in a diff and
# the classic source of merge conflicts. This is the reviewable half - when a
# build setting changes, the change shows up here in one readable line.
#
# Regenerate after editing:  xcodegen

name: LearnrApp

options:
  bundleIdPrefix: com.learnr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LearnrEngine:
    path: LearnrEngine

targets:
  LearnrApp:
    type: application
    platform: iOS
    # 1 = iPhone, 2 = iPad. The web app was written for a standard iPad and the
    # answer pads are sized for one, but a child may well be handed a phone;
    # CodeEntryView caps its width so it reads on both.
    deviceFamily: [1, 2]

    sources:
      - path: LearnrApp/LearnrApp

    dependencies:
      - package: LearnrEngine
        product: LearnrEngine

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnr.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Portrait only. A child is answering questions, not reading a
        # document, and a rotation mid-question moves every target under
        # their hand.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # No Google sign-in, so no third-party SDK and no ATS exception. The
        # deployed API is https, which is what App Transport Security requires.
        ENABLE_USER_SCRIPT_SANDBOXING: YES

    info:
      path: LearnrApp/Info.plist
      properties:
        CFBundleDisplayName: LearnR
        UIRequiresFullScreen: true
        # Overridable per build. Empty means fall back to localhost:3001, which
        # is right for the simulator against a local server; a device build
        # needs the deployed https URL, because ATS refuses plain HTTP.
        LearnrAPIBaseURL: $(LEARNR_API_BASE_URL)

  LearnrAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LearnrApp/LearnrAppTests
    dependencies:
      - target: LearnrApp
    settings:
      base:
        # A test bundle is code-signed too, so it needs its own plist. Left to
        # Xcode to generate rather than committing a second near-empty file.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LearnrApp:
    build:
      targets:
        LearnrApp: all
    run:
      config: Debug
      # Points at a local API server by default. Change it here, or set
      # LEARNR_API_BASE_URL in the build settings, to run against Fly.
      environmentVariables:
        LEARNR_API_BASE_URL: http://localhost:3001
    test:
      config: Debug
      targets:
        - LearnrAppTests
