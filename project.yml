# The Xcode project is generated from this file, not committed.
#
# A .pbxproj is 400-odd lines of machine-written XML: unreviewable in a diff and
# the classic source of merge conflicts. This is the reviewable half - when a
# build setting changes, the change shows up here in one readable line.
#
# Regenerate after editing:  xcodegen

name: LearnrApp

options:
  bundleIdPrefix: com.learnr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LearnrEngine:
    path: LearnrEngine

targets:
  LearnrApp:
    type: application
    platform: iOS
    # 1 = iPhone, 2 = iPad. The web app was written for a standard iPad and the
    # answer pads are sized for one, but a child may well be handed a phone;
    # CodeEntryView caps its width so it reads on both.
    deviceFamily: [1, 2]

    sources:
      - path: LearnrApp/LearnrApp
      # Apple requires the privacy manifest, and it has to be copied into the
      # bundle rather than merely committed - a file sitting beside Info.plist
      # that no target lists is not in the app, and the upload is rejected for
      # a manifest that is technically present in the repository.
      - path: LearnrApp/PrivacyInfo.xcprivacy

    dependencies:
      - package: LearnrEngine
        product: LearnrEngine

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnr.ios
        # The plist substitution below expands this. It needs a value per
        # configuration or it expands to nothing and the key is dropped from
        # the built plist entirely - which is how this silently fell back to
        # localhost the first time.
        LEARNR_API_BASE_URL: https:/$()/learnr-api-syd.fly.dev
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # No Google sign-in, so no third-party SDK and no ATS exception. The
        # deployed API is https, which is what App Transport Security requires.
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # The catalog holds one 1024 image and Xcode cuts every other size from
        # it. Naming it here rather than letting the default apply, because the
        # default is only "AppIcon" when GENERATE_INFOPLIST_FILE is YES, and
        # this target ships a committed plist instead.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing. Set here rather than in Xcode's UI, which would not survive
        # the next xcodegen. T3UMXQFC6X is the "Abu Khan" team - the OU of the
        # only signing identity on this Mac, and the TeamIdentifier of the one
        # provisioning profile. A simulator build ignores both; a device build
        # needs them, and picked the wrong team by hand more than once.
        DEVELOPMENT_TEAM: T3UMXQFC6X
        CODE_SIGN_STYLE: Automatic

    info:
      path: LearnrApp/Info.plist
      properties:
        # Export compliance, answered here so it is not asked on every upload.
        #
        # False means "uses no non-exempt encryption", which is the accurate
        # answer rather than the convenient one: the app imports neither
        # CryptoKit nor CommonCrypto, calls no cipher or digest API, and the one
        # `import Security` is Keychain.swift storing the login token as a
        # kSecClassGenericPassword. Talking to the API is URLSession over HTTPS.
        # All of that is encryption *within* the operating system, which is
        # exempt - the question is about algorithms an app implements itself or
        # supplies in addition to Apple's.
        #
        # Without this key App Store Connect holds every TestFlight build at
        # "Missing Compliance" until the same question is answered by hand.
        # Revisit it if the app ever ships its own crypto.
        ITSAppUsesNonExemptEncryption: false
        # xcodegen writes this plist from these properties, so a hand edit to
        # LearnrApp/Info.plist is lost on the next run - these two keys included.
        # Without them the plist's committed 1.0/1 would be what every upload
        # carried, and App Store Connect rejects a build number it has seen.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # "LearnR" is taken on the App Store, so the listing and the home
        # screen read "LearnR AU". Only the label changes: the bundle id,
        # the target name and what the app calls itself to a child are all
        # still LearnR, and the web app is unchanged.
        CFBundleDisplayName: LearnR AU
        UIRequiresFullScreen: true
        # Without this key iOS takes the app for a pre-iPhone-X binary and
        # runs it letterboxed at 320x568. It has to be a real plist key: the
        # INFOPLIST_KEY_* build settings that would otherwise set it are only
        # merged when GENERATE_INFOPLIST_FILE is YES, and this target ships
        # the committed plist instead.
        UILaunchScreen: {}
        # Portrait only. A child is answering questions, not reading a
        # document, and a rotation mid-question moves every target under
        # their hand.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        # Set from LEARNR_API_BASE_URL above. Note the $() in that value: a
        # bare // in an xcconfig-style setting starts a comment, so the scheme
        # is written https:/$()/ to survive substitution intact.
        #
        # Point a build at a local server by overriding LEARNR_API_BASE_URL,
        # e.g. xcodebuild LEARNR_API_BASE_URL='http:/$()/localhost:3001'.
        LearnrAPIBaseURL: $(LEARNR_API_BASE_URL)

  LearnrAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LearnrApp/LearnrAppTests
    dependencies:
      - target: LearnrApp
    settings:
      base:
        # A test bundle is code-signed too, so it needs its own plist. Left to
        # Xcode to generate rather than committing a second near-empty file.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LearnrApp:
    build:
      targets:
        LearnrApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LearnrAppTests
