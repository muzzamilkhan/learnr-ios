openapi: 3.1.0
info:
  title: LearnR API
  version: 0.1.0
components:
  schemas:
    AttemptInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/AttemptInput'
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        templateId:
          type: string
          minLength: 1
        subject:
          type: string
          minLength: 1
        topic:
          type: string
          minLength: 1
        level:
          $ref: '#/components/schemas/YearLevelInput'
        prompt:
          type: string
        expected:
          type: string
        response:
          type: string
        correct:
          type: boolean
        timeTakenMs:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        answeredAt:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        offsetMinutes:
          type: integer
          minimum: -840
          maximum: 840
        figure: {}
      required:
        - id
        - templateId
        - subject
        - topic
        - level
        - prompt
        - expected
        - response
        - correct
        - timeTakenMs
        - answeredAt
        - offsetMinutes
    AttemptsBodyInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/AttemptsBodyInput'
      type: object
      properties:
        attempts:
          minItems: 1
          maxItems: 200
          type: array
          items:
            $ref: '#/components/schemas/AttemptInput'
      required:
        - attempts
    ChildDetailsInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ChildDetailsInput'
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        avatar:
          type: string
          minLength: 1
        level:
          $ref: '#/components/schemas/YearLevelInput'
        targetKind:
          type:
            - string
            - 'null'
          enum:
            - questions
            - minutes
            - null
        targetValue:
          type:
            - integer
            - 'null'
          exclusiveMinimum: 0
          maximum: 9007199254740991
        photo:
          type:
            - string
            - 'null'
      required:
        - name
        - avatar
        - level
        - targetKind
        - targetValue
        - photo
    CreateSessionInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/CreateSessionInput'
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        subject:
          type: string
          minLength: 1
        level:
          $ref: '#/components/schemas/YearLevelInput'
        seed:
          type: string
          minLength: 1
      required:
        - id
        - subject
        - level
        - seed
    YearLevelInput:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/YearLevelInput'
      type: string
      enum:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        - K
    AcceptResult:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/AcceptResult'
      oneOf:
        - type: object
          properties:
            ok:
              type: boolean
              const: true
            children:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required:
            - ok
            - children
          additionalProperties: false
        - type: object
          properties:
            ok:
              type: boolean
              const: false
            reason:
              type: string
              enum:
                - unavailable
                - own-link
                - error
          required:
            - ok
            - reason
          additionalProperties: false
    Account:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/Account'
      type: object
      properties:
        id:
          type: string
        role:
          description: >-
            May be null. The null is not expressible beside a $ref in OpenAPI
            3.1, so it is said here instead.
          allOf:
            - $ref: '#/components/schemas/Role'
        parentId:
          type:
            - string
            - 'null'
        name:
          type:
            - string
            - 'null'
        avatar:
          description: >-
            May be null. The null is not expressible beside a $ref in OpenAPI
            3.1, so it is said here instead.
          allOf:
            - $ref: '#/components/schemas/Avatar'
        image:
          type:
            - string
            - 'null'
        photo:
          type:
            - string
            - 'null'
      required:
        - id
        - role
        - parentId
        - name
        - avatar
        - image
        - photo
      additionalProperties: false
    AnsweredQuestion:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/AnsweredQuestion'
      type: object
      properties:
        topic:
          type: string
        level:
          $ref: '#/components/schemas/YearLevel'
        prompt:
          type: string
        expected:
          type: string
        response:
          type: string
        correct:
          type: boolean
        answeredAt:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        figure:
          $ref: '#/components/schemas/Figure'
      required:
        - topic
        - level
        - prompt
        - expected
        - response
        - correct
        - answeredAt
      additionalProperties: false
    AttemptResult:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/AttemptResult'
      type: object
      properties:
        streak:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        streakAdvanced:
          type: boolean
      required:
        - streak
        - streakAdvanced
      additionalProperties: false
    Avatar:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/Avatar'
      type: string
      enum:
        - fox
        - bear
        - cat
        - owl
        - frog
        - whale
        - rabbit
        - panda
    BucketUnit:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/BucketUnit'
      type: string
      enum:
        - day
        - week
    ChildAccess:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ChildAccess'
      type: string
      enum:
        - owner
        - viewer
    ChildHistory:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ChildHistory'
      type: object
      properties:
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
        sittings:
          type: array
          items:
            $ref: '#/components/schemas/Sitting'
        answers:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/AnsweredQuestion'
        recentAnswers:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/TargetAnswer'
        speedRuns:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/SummaryRun'
      required:
        - observations
        - sittings
        - answers
        - recentAnswers
        - speedRuns
      additionalProperties: false
    ChildProfile:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ChildProfile'
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatar:
          $ref: '#/components/schemas/Avatar'
        photo:
          type:
            - string
            - 'null'
        level:
          type:
            - string
            - 'null'
        target:
          description: >-
            May be null. The null is not expressible beside a $ref in OpenAPI
            3.1, so it is said here instead.
          allOf:
            - $ref: '#/components/schemas/DailyTarget'
        code:
          type:
            - string
            - 'null'
        codeExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - name
        - avatar
        - photo
        - level
        - target
        - code
        - codeExpiresAt
      additionalProperties: false
    ChildRecord:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ChildRecord'
      type: object
      properties:
        childId:
          type: string
        childName:
          type: string
        mode:
          type: string
        best:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        achievedAt:
          type: string
          format: date-time
      required:
        - childId
        - childName
        - mode
        - best
        - achievedAt
      additionalProperties: false
    ChoiceSpec:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ChoiceSpec'
      type: object
      properties:
        count:
          type: number
        distractors:
          readOnly: true
          type: array
          items:
            type: string
        jitter:
          type: object
          properties:
            min:
              type: string
            max:
              type: string
          required:
            - min
            - max
          additionalProperties: false
        rankIsTheQuestion:
          type: boolean
        propertyIsTheQuestion:
          type: boolean
      required:
        - count
      additionalProperties: false
    ContentManifestLevel:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ContentManifestLevel'
      type: object
      properties:
        level:
          $ref: '#/components/schemas/YearLevel'
        topics:
          type: array
          items:
            type: string
        templateCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        etag:
          type: string
      required:
        - level
        - topics
        - templateCount
        - etag
      additionalProperties: false
    ContentManifest:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ContentManifest'
      type: object
      properties:
        version:
          type: string
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/ContentManifestSubject'
      required:
        - version
        - subjects
      additionalProperties: false
    ContentManifestSubject:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ContentManifestSubject'
      type: object
      properties:
        subject:
          type: string
        levels:
          type: array
          items:
            $ref: '#/components/schemas/ContentManifestLevel'
      required:
        - subject
        - levels
      additionalProperties: false
    ContentPack:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ContentPack'
      type: object
      properties:
        version:
          type: string
        subject:
          type: string
        level:
          $ref: '#/components/schemas/YearLevel'
        templates:
          type: array
          items:
            $ref: '#/components/schemas/QuestionTemplate'
      required:
        - version
        - subject
        - level
        - templates
      additionalProperties: false
    DailyTarget:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/DailyTarget'
      type: object
      properties:
        kind:
          type: string
          enum:
            - questions
            - minutes
        value:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - kind
        - value
      additionalProperties: false
    ErrorCluster:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ErrorCluster'
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ErrorKind'
        count:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        topics:
          type: array
          items:
            type: object
            properties:
              topic:
                type: string
              level:
                $ref: '#/components/schemas/YearLevel'
            required:
              - topic
              - level
            additionalProperties: false
        examples:
          type: array
          items:
            $ref: '#/components/schemas/AnsweredQuestion'
      required:
        - kind
        - count
        - topics
        - examples
      additionalProperties: false
    ErrorKind:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ErrorKind'
      type: string
      enum:
        - copied
        - power-of-ten
        - sign-dropped
        - added-not-multiplied
        - clock-format
    Error:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/Error'
      type: object
      properties:
        error:
          type: string
      required:
        - error
      additionalProperties: false
    FamilyRecord:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/FamilyRecord'
      type: object
      properties:
        playerId:
          type: string
        playerName:
          type: string
        playerPhoto:
          type:
            - string
            - 'null'
        playerAvatar:
          description: >-
            May be null. The null is not expressible beside a $ref in OpenAPI
            3.1, so it is said here instead.
          allOf:
            - $ref: '#/components/schemas/Avatar'
        playerImage:
          type:
            - string
            - 'null'
        mode:
          type: string
        best:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        achievedAt:
          type: string
          format: date-time
      required:
        - playerId
        - playerName
        - mode
        - best
        - achievedAt
      additionalProperties: false
    Figure:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/Figure'
      type: object
      properties:
        width:
          type: number
        height:
          type: number
        marks:
          readOnly: true
          maxItems: 200
          type: array
          items:
            $ref: '#/components/schemas/Mark'
      required:
        - width
        - height
        - marks
      additionalProperties: false
    FigureSpec:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/FigureSpec'
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: polygon
            shape:
              type: string
            rotation:
              type: string
            mirror:
              type: string
            rightAngles:
              type: string
          required:
            - kind
            - shape
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: angle
            degrees:
              type: string
            rotation:
              type: string
            armLength:
              type: string
            arc:
              type: string
          required:
            - kind
            - degrees
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: bar
            values:
              type: string
            labels:
              type: string
            style:
              type: string
            scale:
              type: string
          required:
            - kind
            - values
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: pictograph
            counts:
              type: string
            labels:
              type: string
            key:
              type: string
            halves:
              type: string
          required:
            - kind
            - counts
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: spinner
            sectors:
              type: string
            fills:
              type: string
            rotation:
              type: string
          required:
            - kind
            - sectors
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: solid
            solid:
              type: string
            view:
              type: string
            rotation:
              type: string
          required:
            - kind
            - solid
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: number-line
            at:
              type: string
            from:
              type: string
            to:
              type: string
            step:
              type: string
            minorTicks:
              type: string
          required:
            - kind
            - at
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: clock
            hour:
              type: string
            minute:
              type: string
            numerals:
              type: string
            minuteTicks:
              type: string
          required:
            - kind
            - hour
            - minute
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: array
            rows:
              type: string
            columns:
              type: string
            orientation:
              type: string
          required:
            - kind
            - rows
            - columns
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: fraction-shape
            numerator:
              type: string
            denominator:
              type: string
            shape:
              type: string
            rotation:
              type: string
          required:
            - kind
            - numerator
            - denominator
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: grid
            at:
              type: string
            columns:
              type: string
            rows:
              type: string
            axisLabels:
              type: string
            onLines:
              type: string
          required:
            - kind
            - at
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: timeline
            years:
              type: string
            labels:
              type: string
            from:
              type: string
            to:
              type: string
            step:
              type: string
          required:
            - kind
            - years
          additionalProperties: false
    Headline:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/Headline'
      type: object
      properties:
        minutes:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        questions:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        accuracy:
          type:
            - number
            - 'null'
        minutesDelta:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        questionsDelta:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        accuracyDelta:
          type:
            - number
            - 'null'
      required:
        - minutes
        - questions
        - accuracy
        - minutesDelta
        - questionsDelta
        - accuracyDelta
      additionalProperties: false
    Id:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/Id'
      type: string
      minLength: 1
      maxLength: 64
    InviteDetails:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/InviteDetails'
      type: object
      properties:
        ownerId:
          type: string
        ownerName:
          type:
            - string
            - 'null'
        children:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              avatar:
                $ref: '#/components/schemas/Avatar'
              photo:
                type:
                  - string
                  - 'null'
              level:
                type:
                  - string
                  - 'null'
            required:
              - id
              - name
              - avatar
              - photo
              - level
            additionalProperties: false
        expiresAt:
          type: string
          format: date-time
        live:
          type: boolean
      required:
        - ownerId
        - ownerName
        - children
        - expiresAt
        - live
      additionalProperties: false
    LearnerProfile:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/LearnerProfile'
      type: object
      properties:
        skills:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/TopicSkill'
      required:
        - skills
      additionalProperties: false
    LoginCode:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/LoginCode'
      type: object
      properties:
        code:
          type: string
        expiresAt:
          type: string
      required:
        - code
        - expiresAt
      additionalProperties: false
    Mark:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/Mark'
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              const: path
            points:
              readOnly: true
              type: array
              items:
                readOnly: true
                type: array
                prefixItems:
                  - type: number
                  - type: number
            closed:
              type: boolean
            fill:
              type: boolean
            dashed:
              type: boolean
          required:
            - kind
            - points
            - closed
            - fill
            - dashed
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: arc
            at:
              readOnly: true
              type: array
              prefixItems:
                - type: number
                - type: number
            radius:
              type: number
            from:
              type: number
            to:
              type: number
          required:
            - kind
            - at
            - radius
            - from
            - to
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: dot
            at:
              readOnly: true
              type: array
              prefixItems:
                - type: number
                - type: number
          required:
            - kind
            - at
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              const: label
            at:
              readOnly: true
              type: array
              prefixItems:
                - type: number
                - type: number
            text:
              type: string
          required:
            - kind
            - at
            - text
          additionalProperties: false
    ModeListing:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/ModeListing'
      anyOf:
        - type: object
          properties:
            key:
              type: string
            op:
              type: string
              enum:
                - add
                - subtract
                - divide
                - mixed
            difficulty:
              type: string
              enum:
                - easy
                - moderate
                - hard
          required:
            - key
            - op
            - difficulty
          additionalProperties: false
        - type: object
          properties:
            key:
              type: string
            op:
              type: string
              const: multiply
            tables:
              $ref: '#/components/schemas/TableChoice'
          required:
            - key
            - op
            - tables
          additionalProperties: false
    Observation:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/Observation'
      type: object
      properties:
        topic:
          type: string
        level:
          $ref: '#/components/schemas/YearLevel'
        correct:
          type: boolean
        templateId:
          type: string
        timeTakenMs:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        answeredAt:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        offsetMinutes:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - topic
        - level
        - correct
        - timeTakenMs
        - answeredAt
      additionalProperties: false
    PendingInvite:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: '#/components/schemas/PendingInvite'
      type: object
      properties:
        id:
          type: string
