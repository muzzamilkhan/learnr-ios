  /speed/runs:
    post:
      operationId: submitSpeedRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                mode:
                  type: string
                  minLength: 1
                correct:
                  type: integer
                  minimum: 0
                  maximum: 10000
                playedAt:
                  type: string
                  format: date-time
                  description: >-
                    When the run was played, ISO 8601. Omit it and the server
                    stamps receipt. Hold one stamp per run across every flush of
                    it, as with `id`.
              required:
                - id
                - mode
                - correct
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeedOutcome'
